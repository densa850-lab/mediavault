# Single CI workflow (MV-013). No path filters: every PR and every push to main runs backend,
# web and android, so the required checks are always reported (never missing or "pending").
# Branch protection requires the final `ci-required` gate (plus the three jobs by name).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: mediavault
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mediavault_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mediavault -d mediavault_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The backend refuses to start without an explicit ENVIRONMENT (MV-018).
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://mediavault:ci-only-password@localhost:5432/mediavault_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v -rs
      # Auth/IDOR/migration tests above run against the real PostgreSQL service (TEST_DATABASE_URL);
      # this step also proves the migration chain matches the SQLAlchemy models.
      - name: Migrations apply and match the models
        env:
          DATABASE_URL: postgresql+psycopg://mediavault:ci-only-password@localhost:5432/mediavault_test
        run: uv run alembic upgrade head && uv run alembic check

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - name: Release build must fail without an HTTPS API URL (MV-003)
        run: |
          if ./gradlew --no-daemon -q assembleRelease; then
            echo "::error::assembleRelease succeeded without -Pmediavault.releaseApiBaseUrl"; exit 1
          fi
          if ./gradlew --no-daemon -q assembleRelease -Pmediavault.releaseApiBaseUrl=http://api.example.com/; then
            echo "::error::assembleRelease accepted a non-HTTPS API URL"; exit 1
          fi
      - name: Release build with a valid HTTPS test URL
        run: ./gradlew --no-daemon assembleRelease -Pmediavault.releaseApiBaseUrl=https://api.example.com/

  ci-required:
    name: ci-required
    if: always()
    needs: [backend, web, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "::error::a required job did not succeed ($r)"; exit 1; fi
          done
